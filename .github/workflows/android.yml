name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Unit tests, lint and debug APK
        env:
          TV_TMDB_TOKEN: ${{ secrets.TV_TMDB_TOKEN }}
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: flixtor-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM hardware acceleration for Android Emulator
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM acceleration enabled"
          else
            echo "KVM device not available; emulator will use software acceleration"
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.personal.flixtortv.SolidTvIntegrationTest --console=plain
      - run: npm test --prefix notifications
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build with existing release key
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_COMMIT_SHA: ${{ github.sha }}
          TV_REPORT_URL: ${{ vars.TV_REPORT_URL }}
          TV_TMDB_TOKEN: ${{ secrets.TV_TMDB_TOKEN }}
          TV_INTRODB_API_KEY: ${{ secrets.TV_INTRODB_API_KEY }}
        run: python3 tools/ci_release.py
      - name: Publish stable APK and metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk release.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk release.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Publish latest main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "Skipping stale main build $GITHUB_SHA; main is now $latest_main."
            exit 0
          fi
          if gh release view main-latest >/dev/null 2>&1; then
            gh release edit main-latest --title "Latest main build" --prerelease
            gh release upload main-latest android/app/build/outputs/apk/release/app-release.apk release.json --clobber
          else
            gh release create main-latest android/app/build/outputs/apk/release/app-release.apk release.json --title "Latest main build" --prerelease --notes "Updated by each successful push to main."
          fi
